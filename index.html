<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" href="assets/images/favicon-rsclub91.png"/>
<title>Rsclub91</title>
<!-- The real pages live under pages/. This entry file forwards the root URL.
     Invitation link (?ref=/invitationCode=/code=) -> login/register page
     (code capture + register view). Otherwise -> home. -->
<link rel="canonical" href="pages/home/index.html"/>
<script>
(function(){
  var ref = '';
  try {
    var rp = new URLSearchParams(location.search || '');
    ref = rp.get('ref') || rp.get('invitationCode') || rp.get('code') || '';
  } catch (e) {}
  if (ref) {
    window.location.replace('pages/login/index.html?ref=' + encodeURIComponent(ref));
  } else {
    window.location.replace('pages/home/index.html');
  }
})();
</script>
<style>
html,body{height:100%;width:100%;margin:0;background:#9195a3;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:#fff;text-decoration:none;font-size:15px}
</style>
</head>
<body>
<a href="pages/home/index.html">Loading Rsclub91&hellip;</a>
</body>
</html>
